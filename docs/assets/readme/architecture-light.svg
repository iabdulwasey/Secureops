<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="468" viewBox="0 0 1000 468" role="img" aria-labelledby="t d">
  <title id="t">SecureOps architecture</title>
  <desc id="d">Endpoints (the Go agent, the Rust remote helper and network probes) connect out to the agent gateway over mutual TLS. The gateway validates every frame and bridges to NATS JetStream. The API and the workers work over NATS, with the AI router beside them. People reach the API through the web console, the client portal, the apps and integrations. The workers and the API store data in PostgreSQL under forced row-level security, ClickHouse, VictoriaMetrics and object storage.</desc>
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #000000; stroke-opacity: 0.1; }
      .key { fill: #ffffff; stroke: #4b6cd9; stroke-opacity: 0.6; }
      .title { font-size: 14px; font-weight: 600; fill: #161719; }
      .sub { font-size: 12px; fill: #545559; }
      .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.1px; fill: #6a6c6f; }
      .wire { fill: none; stroke: #6a6c6f; stroke-opacity: 0.55; stroke-width: 1.25; }
      .tip { fill: #6a6c6f; fill-opacity: 0.8; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0.8 L7 4 L0 7.2 Z" class="tip" />
    </marker>
    <filter id="lift" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="467" rx="16" fill="#fafafa" stroke="#000000" stroke-opacity="0.08" />

  <!-- Column labels -->
  <g class="sans eyebrow">
    <text x="32" y="42">ENDPOINTS</text>
    <text x="268" y="42">EDGE</text>
    <text x="460" y="42">CORE</text>
    <text x="820" y="42">PEOPLE</text>
    <text x="268" y="372">DATA</text>
  </g>

  <g filter="url(#lift)">
    <!-- Endpoints -->
    <rect x="32.5" y="56.5" width="196" height="60" rx="10" class="card" />
    <rect x="32.5" y="132.5" width="196" height="60" rx="10" class="card" />
    <rect x="32.5" y="208.5" width="196" height="60" rx="10" class="card" />
    <!-- Edge -->
    <rect x="268.5" y="132.5" width="160" height="60" rx="10" class="key" />
    <!-- Core -->
    <rect x="460.5" y="56.5" width="320" height="60" rx="10" class="card" />
    <rect x="460.5" y="132.5" width="320" height="60" rx="10" class="key" />
    <rect x="460.5" y="208.5" width="154" height="60" rx="10" class="card" />
    <rect x="626.5" y="208.5" width="154" height="60" rx="10" class="card" />
    <!-- People -->
    <rect x="820.5" y="56.5" width="148" height="60" rx="10" class="card" />
    <rect x="820.5" y="132.5" width="148" height="60" rx="10" class="card" />
    <rect x="820.5" y="208.5" width="148" height="60" rx="10" class="card" />
    <rect x="820.5" y="284.5" width="148" height="60" rx="10" class="card" />
    <!-- Data -->
    <rect x="268.5" y="386.5" width="166" height="56" rx="10" class="key" />
    <rect x="446.5" y="386.5" width="166" height="56" rx="10" class="card" />
    <rect x="624.5" y="386.5" width="166" height="56" rx="10" class="card" />
    <rect x="802.5" y="386.5" width="166" height="56" rx="10" class="card" />
  </g>

  <g class="sans">
    <text x="48" y="82" class="title">Go agent</text>
    <text x="48" y="101" class="sub">Windows, macOS, Linux</text>
    <text x="48" y="158" class="title">Remote helper</text>
    <text x="48" y="177" class="sub">Rust, VP9 desktop</text>
    <text x="48" y="234" class="title">Network probe</text>
    <text x="48" y="253" class="sub">SNMP, syslog, flows</text>

    <text x="284" y="158" class="title">Agent gateway</text>
    <text x="284" y="177" class="sub">mTLS, frame checks</text>

    <text x="476" y="82" class="title">API</text>
    <text x="476" y="101" class="sub">REST, GraphQL, live updates, webhooks</text>
    <text x="476" y="158" class="title">NATS JetStream</text>
    <text x="476" y="177" class="sub">transport, events, presence, live updates</text>
    <text x="476" y="234" class="title">Workers</text>
    <text x="476" y="253" class="sub">jobs, Temporal</text>
    <text x="642" y="234" class="title">AI router</text>
    <text x="642" y="253" class="sub">retrieval, evals</text>

    <text x="836" y="82" class="title">Web console</text>
    <text x="836" y="101" class="sub">the workspace</text>
    <text x="836" y="158" class="title">Client portal</text>
    <text x="836" y="177" class="sub">per-client brand</text>
    <text x="836" y="234" class="title">Apps</text>
    <text x="836" y="253" class="sub">mobile, tray, Teams</text>
    <text x="836" y="310" class="title">Integrations</text>
    <text x="836" y="329" class="sub">SDKs, MCP, iPaaS</text>

    <text x="284" y="410" class="title">PostgreSQL</text>
    <text x="284" y="428" class="sub">forced row-level security</text>
    <text x="462" y="410" class="title">ClickHouse</text>
    <text x="462" y="428" class="sub">events, warehouse</text>
    <text x="640" y="410" class="title">VictoriaMetrics</text>
    <text x="640" y="428" class="sub">metrics</text>
    <text x="818" y="410" class="title">Object storage</text>
    <text x="818" y="428" class="sub">S3 or MinIO</text>

    <text x="32" y="306" class="sub">
      <tspan x="32" dy="0">Every device dials out once,</tspan>
      <tspan x="32" dy="17">over TLS or WebSocket on 443.</tspan>
      <tspan x="32" dy="17">No inbound firewall rule.</tspan>
    </text>
  </g>

  <!-- Endpoints to the gateway: one outbound connection each -->
  <path d="M229 86.5 H248 M229 162.5 H248 M229 238.5 H248 M248 86.5 V238.5" class="wire" />
  <path d="M248 162.5 H266" class="wire" marker-end="url(#arrow)" />
  <path d="M431 162.5 H458" class="wire" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <path d="M537.5 117 V132 M537.5 193 V208 M703.5 193 V208" class="wire" />
  <!-- People to the API -->
  <path d="M820 86.5 H800 M820 162.5 H800 M820 238.5 H800 M820 314.5 H800 M800 86.5 V314.5" class="wire" />
  <path d="M800 86.5 H783" class="wire" marker-end="url(#arrow)" />
  <!-- Core to data -->
  <path d="M620.5 196 V348 M351 348 H885 M351 348 V380 M529 348 V380 M707 348 V380 M885 348 V380" class="wire" />
  <g class="tip">
    <path d="M347 378 L351 385 L355 378 Z" />
    <path d="M525 378 L529 385 L533 378 Z" />
    <path d="M703 378 L707 385 L711 378 Z" />
    <path d="M881 378 L885 385 L889 378 Z" />
  </g>
</svg>
